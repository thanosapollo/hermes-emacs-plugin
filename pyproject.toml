[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-emacs-plugin"
version = "0.1.0"
description = "Stdio MCP bridge from the Hermes agent host to the user's Emacs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Talos Apollo", email = "talosbot@thanosapollo.org" }]
keywords = ["mcp", "emacs", "hermes", "llm", "agent", "bridge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Editors :: Emacs",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.0.0,<2",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://git.thanosapollo.org/hermes-emacs-plugin"
Repository = "https://git.thanosapollo.org/hermes-emacs-plugin"

[project.scripts]
hermes-emacs-mcp = "hermes_emacs_plugin.server:main"

[tool.setuptools]
packages = ["hermes_emacs_plugin", "hermes_emacs_plugin.tools"]
